name: Deploy Jekyll site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to build"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for commit to exist
        run: |
          echo "Waiting for commit ${{ github.event.inputs.sha }}"
          until git ls-remote https://github.com/${{ github.repository }} ${{ github.event.inputs.sha }} | grep ${{ github.event.inputs.sha }}; do
            sleep 2
          done
          echo "Commit is available."

      - name: Clone repo at exact SHA
        run: |
          git clone https://github.com/${{ github.repository }} repo
          cd repo
          git checkout ${{ github.event.inputs.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install dependencies
        working-directory: repo
        run: bundle install

      - name: Build with Jekyll
        working-directory: repo
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
