name: Schedule Posts

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight.
  push:
    paths:
      - 'scheduled/**'
  workflow_dispatch:

jobs:
  schedule:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Run scheduling script
      run: node deploy/schedulePosts.js

    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add _posts/*.md
        git add scheduled/*.md
        git commit -m "Auto-publish scheduled posts" || echo "No changes to commit"

    - name: Push changes
      run: git push

