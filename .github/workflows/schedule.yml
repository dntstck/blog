name: Schedule Posts

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - 'scheduled/**'
  workflow_dispatch:

jobs:
  schedule:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        clean: false

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Run scheduling script
      run: node deploy/schedulePosts.js

    - name: Trigger Jekyll build workflow
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/jekyll-build.yml/dispatches \
          -d '{"ref":"master"}'
